<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Guri Pituba News
</title>

<style>

* { box-sizing:border-box;margin:0;padding:0 }

html,body{
width:100%;
height:100%;
background:#000;
font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
overflow:hidden;
}

/* SLIDES */

.presentation-frame{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
border:none;
z-index:1;
}

/* BARRA */

.info-bar{
position:absolute;
bottom:0;
left:0;
width:100%;
height:13%;
min-height:90px;
z-index:999;
background:#0b1c5a;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 2rem;
box-shadow:0 -4px 20px rgba(0,0,0,.4);
}

.left-group{
display:flex;
align-items:center;
height:100%;
flex:0 0 auto;
background:#0b1c5a;
padding-right:20px;
z-index:1000;
}

.logo-box{
background:#fff;
border-radius:12px;
height:75%;
aspect-ratio:1/1;
display:flex;
align-items:center;
justify-content:center;
padding:5px;
margin-right:20px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.logo-box img{
max-width:100%;
max-height:100%;
object-fit:contain;
}

.vertical-divider{
width:2px;
height:60%;
background:rgba(255,255,255,.3);
margin-right:20px;
}

.date-display{
display:flex;
flex-direction:column;
justify-content:center;
}

.day-line{
font-size:3.2vh;
font-weight:800;
line-height:1.1;
text-transform:capitalize;
}

.date-line{
font-size:1.8vh;
opacity:.95;
}

/* NEWS */

.marquee-container{
flex:1;
height:100%;
position:relative;
overflow:hidden;
display:flex;
align-items:center;

mask-image:linear-gradient(to right,transparent,black 5%,black 95%,transparent);
-webkit-mask-image:linear-gradient(to right,transparent,black 5%,black 95%,transparent);
}

.marquee-content{
position:absolute;
white-space:nowrap;
display:inline-block;
will-change:transform;
color:#fff;
font-size:3.5vh;
font-weight:600;
letter-spacing:.5px;
text-shadow:1px 1px 3px rgba(0,0,0,.2);
}

.separator{
color:rgba(255,255,255,.5);
margin:0 40px;
font-weight:300;
}

.right-group{
display:flex;
align-items:center;
height:100%;
flex:0 0 auto;
background:#0b1c5a;
padding-left:20px;
z-index:1000;
}

.weather-container{
display:flex;
align-items:center;
margin-right:20px;
}

.weather-icon-box img{
width:50px;
height:50px;
filter:brightness(0) invert(1);
margin-right:5px;
}

.weather-temp{
font-size:3.5vh;
font-weight:800;
line-height:1;
}

.weather-city{
font-size:1.5vh;
font-weight:600;
opacity:.9;
}

.time-display{
color:#fff;
font-size:5vh;
font-weight:700;
font-variant-numeric:tabular-nums;
margin-left:20px;
}

@keyframes scrollLeft{
0%{transform:translateX(100vw)}
100%{transform:translateX(-100%)}
}

</style>
</head>

<body>

<iframe id="slide-frame" class="presentation-frame"></iframe>

<div class="info-bar">

<div class="left-group">

<div class="logo-box">
<img src="https://d24d7vsshzrslo.cloudfront.net/sites/school101/files/2024-03/31653_marca_guri_azul_vertical_3.png">
</div>

<div class="vertical-divider"></div>

<div class="date-display">
<div id="day-line" class="day-line"></div>
<div id="date-line" class="date-line"></div>
</div>

</div>

<div class="marquee-container">
<div id="marquee-text" class="marquee-content">Carregando Notícias...</div>
</div>

<div class="right-group">

<div class="weather-container">
<div class="weather-icon-box">
<img id="weather-icon-img">
</div>

<div>
<div class="weather-temp" id="weather-temp">--°C</div>
<div class="weather-city">Salvador - BA</div>
</div>
</div>



<div class="vertical-divider"></div>

<div class="time-display" id="time-container">--:--</div>

</div>

</div>

<script>

/* CONFIG */

const SLIDE_URL="https://docs.google.com/presentation/d/16A88nuzgYMYxBBEAWr6zYQdMKDuKxbB2/embed?start=true&loop=true&rm=minimal&delayms=60000"
const SHEET_ID="1GOoCO5ius_FFeN5GecYlwTZcBkPRvqbA"
const VELOCIDADE_PX_SEG=120

const WEATHER_API="https://api.openweathermap.org/data/2.5/weather?q=Salvador&appid=ff0a9d4e6f632ea18d6ce175c676d736&units=metric&lang=pt_br"

/* SLIDES */

function loadSlides(){
  const frame = document.getElementById("slide-frame")
  frame.src = "about:blank"

  setTimeout(()=>{
    frame.src = SLIDE_URL + "&t=" + Date.now()
  }, 500)
}

loadSlides()

setInterval(loadSlides,900000)
setInterval(()=>location.reload(),1800000)

/* RELÓGIO */

function updateClock(){

const now=new Date()

let rawDay=new Intl.DateTimeFormat("pt-BR",{weekday:"long"}).format(now)
const day=rawDay.charAt(0).toUpperCase()+rawDay.slice(1)

const date=new Intl.DateTimeFormat("pt-BR",{day:"numeric",month:"long",year:"numeric"}).format(now)
const time=now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})

document.getElementById("day-line").textContent=day
document.getElementById("date-line").textContent=date
document.getElementById("time-container").textContent=time

}

setInterval(updateClock,1000)
updateClock()

/* CLIMA */

async function fetchWeather(){

try{

const res=await fetch(WEATHER_API)
const data=await res.json()

document.getElementById("weather-temp").textContent=Math.round(data.main.temp)+"°C"
document.getElementById("weather-icon-img").src=`https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`

}catch{}

}

fetchWeather()
setInterval(fetchWeather,900000)

/* NEWS */

const marquee=document.getElementById("marquee-text")
let duracaoAtual = 120

async function fetchNews(){

try{

const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&t=${Date.now()}`
const res=await fetch(url)
const text=await res.text()

const lines=text.split("\n").slice(1)

const news=lines
.map(l=>l.replace(/"/g,"").trim())
.filter(Boolean)

marquee.innerHTML=news.join('<span class="separator">|</span>')

setTimeout(()=>{

const larguraTexto=marquee.offsetWidth
const larguraTela=window.innerWidth

duracaoAtual=(larguraTexto+larguraTela)/VELOCIDADE_PX_SEG

marquee.style.animation = `scrollLeft ${duracaoAtual}s linear infinite`

},100)

}catch{}

}

/* 🔥 CICLO INTELIGENTE */

fetchNews()
setInterval(fetchNews, 60000) // atualiza a cada 1 minuto

/* FULLSCREEN */

function openFullscreen(){

const elem=document.documentElement

if(elem.requestFullscreen)elem.requestFullscreen()
else if(elem.webkitRequestFullscreen)elem.webkitRequestFullscreen()

}

setTimeout(openFullscreen,2000)

setTimeout(openFullscreen,2000)

/* WATCHDOG - evita tela branca */
setInterval(() => {
  if (!document.body.innerHTML.trim()) {
    location.reload()
  }
}, 60000)


</script>

</body>
</html>
