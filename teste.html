<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Eleva News - São Paulo</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%;
    height: 100%;
    background-color: #000;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
}

/* SLIDE */
.presentation-frame {
    position: absolute;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 1;
}

/* BARRA */
.info-bar {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 13%;
    min-height: 90px;
    background-color: #ff8e03;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    z-index: 999;
}

/* ESQUERDA */
.left-group {
    display: flex;
    align-items: center;
}

.logo-box {
    background: #fff;
    border-radius: 12px;
    height: 75px;
    width: 75px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 20px;
}

.logo-box img {
    max-width: 90%;
    max-height: 90%;
}

.vertical-divider {
    width: 2px;
    height: 50px;
    background: rgba(255,255,255,0.4);
    margin: 0 20px;
}

.date-display {
    display: flex;
    flex-direction: column;
}

.day-line {
    font-size: 20px;
    font-weight: 700;
}

.date-line {
    font-size: 14px;
}

/* MARQUEE */
.marquee-container {
    flex: 1;
    overflow: hidden;
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
}

.marquee-content {
    position: absolute;
    white-space: nowrap;
    font-size: 22px;
    font-weight: 600;
}

.separator {
    margin: 0 30px;
}

/* DIREITA */
.right-group {
    display: flex;
    align-items: center;
}

.weather-container {
    display: flex;
    align-items: center;
    margin-right: 20px;
}

.weather-container img {
    width: 40px;
    margin-right: 10px;
    filter: brightness(0) invert(1);
}

.weather-temp {
    font-size: 22px;
    font-weight: 700;
}

.time-display {
    font-size: 40px;
    font-weight: 700;
    margin-left: 20px;
}

/* ANIMAÇÃO */
@keyframes scrollLeft {
    from { transform: translateX(100vw); }
    to { transform: translateX(-100%); }
}
</style>
</head>

<body>

<iframe class="presentation-frame"
src="https://docs.google.com/presentation/d/1zLaYJiXkRtY5oeEn-kltcUWGZF6sG8DK/embed?start=true&loop=true&rm=minimal&delayms=60000"
allowfullscreen>
</iframe>

<div class="info-bar">

<div class="left-group">
<div class="logo-box">
<img src="https://d24d7vsshzrslo.cloudfront.net/sites/school10/files/2022-09/logo_escola_eleva.png">
</div>

<div class="vertical-divider"></div>

<div class="date-display">
<div id="day-line" class="day-line"></div>
<div id="date-line" class="date-line"></div>
</div>
</div>

<div class="marquee-container">
<div id="marquee-text" class="marquee-content">Carregando notícias...</div>
</div>

<div class="right-group">

<div class="weather-container">
<img id="weather-icon">
<div class="weather-temp" id="weather-temp">--°C</div>
</div>

<div class="vertical-divider"></div>

<div id="time-display" class="time-display"></div>

</div>
</div>

<script>
/* CONFIG */
const SHEET_ID = "1eqxuVOCbTQU4zBfzGSM67VyNSSddPC9V";
const NEWS_INTERVAL = 30000;
const WEATHER_INTERVAL = 600000;
const VELOCIDADE = 120;

/* RELÓGIO */
function updateClock() {
    const now = new Date();
    const options = { timeZone: "America/Sao_Paulo" };

    document.getElementById("day-line").textContent =
        now.toLocaleDateString("pt-BR", { weekday: "long", ...options });

    document.getElementById("date-line").textContent =
        now.toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric", ...options });

    document.getElementById("time-display").textContent =
        now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", ...options });
}
setInterval(updateClock, 1000);
updateClock();

/* CLIMA */
async function fetchWeather() {
    try {
        const apiKey = "ff0a9d4e6f632ea18d6ce175c676d736";
        const url = `https://api.openweathermap.org/data/2.5/weather?q=Sao Paulo,BR&appid=${apiKey}&units=metric&lang=pt_br`;

        const response = await fetch(url);
        const data = await response.json();

        document.getElementById("weather-temp").textContent =
            Math.round(data.main.temp) + "°C";

        document.getElementById("weather-icon").src =
            `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;

    } catch {}
}
fetchWeather();
setInterval(fetchWeather, WEATHER_INTERVAL);

/* NOTÍCIAS */
let lastContent = "";
const marquee = document.getElementById("marquee-text");

async function fetchNews() {
    try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0&cache=${Date.now()}`;

        const response = await fetch(url, { cache: "no-store" });
        const csv = await response.text();

        const rows = csv.split("\n").slice(1);

        const news = rows
            .map(row => row.replace(/^"|"$/g, "").trim())
            .filter(Boolean);

        const content = news.length
            ? news.join('<span class="separator">|</span>')
            : "Bem-vindo à Escola Eleva São Paulo";

        if (content !== lastContent) {
            lastContent = content;
            marquee.innerHTML = content;

            setTimeout(() => {
                const textWidth = marquee.offsetWidth;
                const screenWidth = window.innerWidth;
                const duration = (textWidth + screenWidth) / VELOCIDADE;

                marquee.style.animation = "none";
                marquee.offsetHeight;
                marquee.style.animation =
                    `scrollLeft ${duration}s linear infinite`;
            }, 200);
        }

    } catch (error) {
        console.log("Erro planilha:", error);
    }
}
fetchNews();
setInterval(fetchNews, NEWS_INTERVAL);

/* RELOAD 24H */
setTimeout(() => location.reload(true), 86400000);
</script>

</body>
</html>
