<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Eleva News - Botafogo</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
        }

        /* SLIDES */
        .presentation-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* BARRA INFERIOR */
        .info-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 13%;
            min-height: 90px;
            z-index: 999;
            background: #ff8e03;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            box-shadow: 0 -4px 20px rgba(0,0,0,.4);
        }

        .left-group { display: flex; align-items: center; }

        .logo-box {
            background: #fff;
            border-radius: 10px;
            height: 65px;
            width: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
        }

        .logo-box img { max-width: 85%; max-height: 85%; object-fit: contain; }

        .vertical-divider {
            width: 2px;
            height: 50px;
            background: rgba(255,255,255,.3);
            margin: 0 20px;
        }

        .date-display { display: flex; flex-direction: column; min-width: 150px; }
        .day-line { font-size: 2.8vh; font-weight: 800; } /* Ajustado para caber nome completo */
        .date-line { font-size: 1.8vh; opacity: 0.9; }

        /* NOTÍCIAS (MARQUEE OTIMIZADO) */
        .marquee-container {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            margin: 0 20px;
        }

        #marquee-text {
            display: inline-block;
            white-space: nowrap;
            font-size: 3.5vh;
            font-weight: 600;
            padding-left: 100%;
            animation: scroll-left 45s linear infinite; /* 45s para leitura confortável */
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .separator { margin: 0 50px; color: rgba(255,255,255,0.5); }

        /* DIREITA */
        .right-group { display: flex; align-items: center; }

        .weather-container { display: flex; align-items: center; margin-right: 20px; }

        .weather-icon-box img {
            width: 55px;
            height: 55px;
            filter: brightness(0) invert(1);
        }

        .weather-temp { font-size: 3.5vh; font-weight: 800; margin-left: 5px; }
        .weather-city { font-size: 1.4vh; text-align: right; }

        .time-display {
            font-size: 5vh;
            font-weight: 700;
            min-width: 120px;
            text-align: right;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <iframe id="slide-frame" class="presentation-frame"></iframe>

    <div class="info-bar">
        <div class="left-group">
            <div class="logo-box">
                <img src="https://d24d7vsshzrslo.cloudfront.net/sites/school10/files/2022-09/logo_escola_eleva.png" alt="Logo">
            </div>
            <div class="vertical-divider"></div>
            <div class="date-display">
                <div id="day-line" class="day-line">--</div>
                <div id="date-line" class="date-line">--</div>
            </div>
        </div>

        <div class="marquee-container">
            <div id="marquee-text">Carregando notícias...</div>
        </div>

        <div class="right-group">
            <div class="weather-container">
                <div class="weather-icon-box">
                    <img id="weather-icon-img" src="" style="display:none;">
                </div>
                <div>
                    <div id="weather-temp" class="weather-temp">--°C</div>
                    <div class="weather-city">Rio de Janeiro</div>
                </div>
            </div>
            <div class="vertical-divider"></div>
            <div id="time-container" class="time-display">00:00</div>
        </div>
    </div>

    <script>
        /* CONFIGURAÇÕES */
        const SLIDE_URL = "https://docs.google.com/presentation/d/1DGoAjEoJlrCjzNGgVUDsi8ehTzpwxPJbt6-muG5Ry3k/embed?start=true&loop=true&rm=minimal&delayms=60000";
        const SHEET_ID = "1CZ0NkBomU3prL1EmSk_baavwJRQySmjzRTf0HdLPMvo";
        const WEATHER_API = "https://api.openweathermap.org/data/2.5/weather?q=Rio%20de%20Janeiro&appid=ff0a9d4e6f632ea18d6ce175c676d736&units=metric&lang=pt_br";

        /* INICIALIZAÇÃO */
        function init() {
            document.getElementById("slide-frame").src = SLIDE_URL;
            updateClock();
            fetchWeather();
            fetchNews();
            
            // Intervalos otimizados para evitar travamentos
            setInterval(updateClock, 30000); 
            setInterval(fetchWeather, 900000); // 15 min
            setInterval(fetchNews, 300000);   // 5 min
            
            // Recarregamento total preventivo a cada 4 horas
            setInterval(() => location.reload(), 14400000);
        }

        /* RELÓGIO */
        function updateClock() {
            const now = new Date();
            
            // Dia da semana completo com primeira letra maiúscula
            let diaSemana = now.toLocaleDateString("pt-BR", { weekday: 'long' });
            diaSemana = diaSemana.charAt(0).toUpperCase() + diaSemana.slice(1);

            const dataCurta = now.toLocaleDateString("pt-BR", { day: '2-digit', month: 'long' });
            
            document.getElementById("day-line").textContent = diaSemana;
            document.getElementById("date-line").textContent = dataCurta;
            document.getElementById("time-container").textContent = now.toLocaleTimeString("pt-BR", { hour: '2-digit', minute: '2-digit' });
        }

        /* CLIMA */
        async function fetchWeather() {
            try {
                const res = await fetch(WEATHER_API);
                const data = await res.json();
                if (data.main) {
                    document.getElementById("weather-temp").textContent = Math.round(data.main.temp) + "°C";
                    const icon = data.weather[0].icon;
                    const iconImg = document.getElementById("weather-icon-img");
                    iconImg.src = `https://openweathermap.org/img/wn/${icon}@2x.png`;
                    iconImg.style.display = "block";
                }
            } catch (e) { console.error("Erro clima"); }
        }

        /* NOTÍCIAS */
        async function fetchNews() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&t=${Date.now()}`;
                const res = await fetch(url);
                const text = await res.text();
                
                const news = text.split("\n")
                    .slice(1)
                    .map(l => l.replace(/"/g, "").trim())
                    .filter(l => l.length > 2);

                if (news.length > 0) {
                    const content = news.join(' <span class="separator"> | </span> ');
                    const marquee = document.getElementById("marquee-text");
                    
                    if (marquee.innerHTML !== content) {
                        marquee.innerHTML = content;
                    }
                }
            } catch (e) { console.error("Erro news"); }
        }

        window.onload = init;
    </script>

</body>
</html>
