<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Slides</title>

<style>
html,body{
margin:0;
height:100%;
background:#000;
overflow:hidden;
}

iframe{
position:absolute;
width:100%;
height:100%;
border:0;
}
</style>
</head>

<body>

<iframe id="slides"
src="https://docs.google.com/presentation/d/1BfDmmXdLbYf4pwT3qr3zT3Vi83jXSxVh/embed?start=true&loop=true&delayms=60000"
allowfullscreen>
</iframe>

<script>

/* reinicia slides periodicamente para evitar travamento */

setInterval(()=>{
document.getElementById("slides").src =
"https://docs.google.com/presentation/d/1BfDmmXdLbYf4pwT3qr3zT3Vi83jXSxVh/embed?start=true&loop=true&delayms=60000&t="+Date.now()
},900000)

/* reload completo a cada 6h */

setInterval(()=>{
location.reload()
},21600000)

</script>

</body>
</html>
